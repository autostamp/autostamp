[package]
name = "autostamp:snyk"
version = "0.3.0+snyk-1.0.0"
registry = "ghcr.io/autostamp/snyk"
kind = "component"
file = "build/snyk.wasm"
description = "WebAssembly component bindings for the snyk API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies.components]

[dependencies.interfaces."wasmcloud:secrets"]
registry = "ghcr.io"
namespace = "wasmcloud"
package = "interfaces/wasmcloud/secrets"
version = "1.0.0"
