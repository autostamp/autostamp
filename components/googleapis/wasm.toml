[package]
name = "autostamp:googleapis"
version = "0.3.0+googleapis-v1"
registry = "ghcr.io/autostamp/googleapis"
kind = "component"
file = "build/googleapis.wasm"
description = "WebAssembly component bindings for the googleapis API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies.components]

[dependencies.interfaces."wasmcloud:secrets"]
registry = "ghcr.io"
namespace = "wasmcloud"
package = "interfaces/wasmcloud/secrets"
version = "1.0.0"
