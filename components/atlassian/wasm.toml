[package]
name = "autostamp:atlassian"
version = "0.3.0+atlassian-1001.0.0-SNAPSHOT"
registry = "ghcr.io/autostamp/atlassian"
kind = "component"
file = "build/atlassian.wasm"
description = "WebAssembly component bindings for the atlassian API, generated from an OpenAPI document."
