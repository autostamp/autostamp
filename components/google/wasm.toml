[package]
name = "autostamp:google"
version = "0.3.0+google-v3"
registry = "ghcr.io/autostamp/google"
kind = "component"
file = "build/google.wasm"
description = "WebAssembly component bindings for the google API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
