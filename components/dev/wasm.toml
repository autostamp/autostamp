[package]
name = "autostamp:dev"
version = "0.3.0+dev-1.0.0"
registry = "ghcr.io/autostamp/dev"
kind = "component"
file = "build/dev.wasm"
description = "WebAssembly component bindings for the dev API, generated from an OpenAPI document."
