[package]
name = "autostamp:kubernetes"
version = "0.2.1+kubernetes-unversioned"
registry = "ghcr.io/autostamp/kubernetes"
kind = "component"
file = "build/kubernetes.wasm"
description = "WebAssembly component bindings for the kubernetes API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies.components]

[dependencies.interfaces."wasmcloud:secrets"]
registry = "ghcr.io"
namespace = "wasmcloud"
package = "interfaces/wasmcloud/secrets"
version = "1.0.0"
