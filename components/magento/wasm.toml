[package]
name = "autostamp:magento"
version = "0.3.0+magento-2.2.10"
registry = "ghcr.io/autostamp/magento"
kind = "component"
file = "build/magento.wasm"
description = "WebAssembly component bindings for the magento API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies.components]

[dependencies.interfaces."wasmcloud:secrets"]
registry = "ghcr.io"
namespace = "wasmcloud"
package = "interfaces/wasmcloud/secrets"
version = "1.0.0"
