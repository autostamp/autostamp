[package]
name = "autostamp:gitlab"
version = "0.3.0+gitlab-v3"
registry = "ghcr.io/autostamp/gitlab"
kind = "component"
file = "build/gitlab.wasm"
description = "WebAssembly component bindings for the gitlab API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies.components]

[dependencies.interfaces."wasmcloud:secrets"]
registry = "ghcr.io"
namespace = "wasmcloud"
package = "interfaces/wasmcloud/secrets"
version = "1.0.0"
