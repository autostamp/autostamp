[package]
name = "autostamp:mandrillapp"
version = "0.2.0+mandrillapp-1.0"
registry = "ghcr.io/autostamp/mandrillapp"
kind = "component"
file = "build/mandrillapp.wasm"
description = "WebAssembly component bindings for the mandrillapp API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies.components]

[dependencies.interfaces."wasi:http"]
registry = "ghcr.io"
namespace = "webassembly"
package = "wasi/http"
version = "0.2.3"

[dependencies.interfaces."wasmcloud:secrets"]
registry = "ghcr.io"
namespace = "wasmcloud"
package = "interfaces/wasmcloud/secrets"
version = "1.0.0"
