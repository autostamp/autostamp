[package]
name = "autostamp:hubapi"
version = "0.3.0+hubapi-v3"
registry = "ghcr.io/autostamp/hubapi"
kind = "component"
file = "build/hubapi.wasm"
description = "WebAssembly component bindings for the hubapi API, generated from an OpenAPI document."
source = "https://github.com/yoshuawuyts/openapi-bindgen"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies.components]

[dependencies.interfaces."wasmcloud:secrets"]
registry = "ghcr.io"
namespace = "wasmcloud"
package = "interfaces/wasmcloud/secrets"
version = "1.0.0"
