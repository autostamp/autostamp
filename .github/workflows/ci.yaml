name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - trying

env:
  RUSTFLAGS: -Dwarnings

jobs:
  build_and_test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@master

    - name: Install ${{ matrix.rust }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        override: true

    - name: check
      uses: actions-rs/cargo@v1
      with:
        command: check
        args: --workspace --all-targets --all-features

    - name: tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --workspace --all-features

  check_fmt_and_docs:
    name: Checking fmt and docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt, clippy
        override: true

    - name: fmt
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Docs
      run: cargo doc --workspace --all-features --no-deps

  mcp_components:
    name: MCP mock-only component integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust with WASI component target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip2

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2

    - name: Install component tools
      run: |
        cargo install --locked --version 1.240.0 wasm-tools
        cargo install --locked --version 0.10.0 wac-cli

    - name: Install Wasmtime
      uses: bytecodealliance/actions/wasmtime/setup@v1
      with:
        version: "45.0.1"

    - name: Verify component tool versions
      run: |
        wasm-tools --version
        wac --version
        wasmtime --version

    - name: Build both generator components without native dependencies
      run: cargo build --workspace --lib --no-default-features --target wasm32-wasip2

    - name: CLI integration with loopback mocks
      run: python3 crates/autostamp-mcp/tests/cli_e2e.py

    - name: Generated component runtime with loopback mocks
      run: python3 crates/autostamp-mcp/tests/component_runtime.py
