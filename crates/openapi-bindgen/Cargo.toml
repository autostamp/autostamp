[package]
name = "openapi-bindgen"
description = "Convert OpenAPI schema definitions to WebAssembly Components"
readme = "README.md"
keywords = []
categories = []
version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]

[dependencies]
anyhow = "1"
heck = "0.5"
indexmap = "2"
openapiv3 = "2"
serde_json = "1"
wit-parser = "0.227"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[dev-dependencies]
serde_yaml = "0.9"

[lints]
workspace = true
