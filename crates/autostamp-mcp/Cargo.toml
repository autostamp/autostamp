[package]
name = "autostamp-mcp"
description = "Convert MCP tool definitions to WebAssembly Components"
version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/autostamp-mcp"
edition.workspace = true
authors.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
heck = "0.5"
http = "1"
semver = "1"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
wit-parser = "0.227"

[dev-dependencies]
wasmparser = "0.227"
wit-component = "0.227"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[lints]
workspace = true
