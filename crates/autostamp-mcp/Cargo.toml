[package]
name = "autostamp-mcp"
description = "Convert MCP tool definitions to WebAssembly Components"
version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/autostamp-mcp"
edition.workspace = true
authors.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "autostamp-mcp"
path = "src/bin/autostamp-mcp.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:bytes", "dep:clap", "dep:reqwest", "dep:sha2", "dep:tokio", "serde/derive"]

[dependencies]
heck = "0.5"
http = "1"
semver = "1"
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
wit-parser = "0.227"

[dev-dependencies]
wasmparser = "0.227"
wit-component = "0.227"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "test-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[lints]
workspace = true
