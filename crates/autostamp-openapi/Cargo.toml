[package]
name = "autostamp-openapi"
description = "Convert OpenAPI schema definitions to WebAssembly Components"
version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/autostamp-openapi"
edition.workspace = true
authors.workspace = true
readme = "README.md"
keywords = []
categories = []

[lib]
crate-type = ["cdylib", "rlib"]

[features]

[dependencies]
anyhow = "1"
heck = "0.5"
indexmap = "2"
openapiv3 = "2"
serde_json = { version = "1", features = ["preserve_order"] }
wit-parser = "0.227"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[dev-dependencies]
serde_yaml = "0.9"

[lints]
workspace = true
